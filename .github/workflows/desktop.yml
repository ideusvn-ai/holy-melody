name: desktop

# - push lên main: kiểm tra nhanh trên Linux, nếu qua thì build macOS + Windows
# - Kết quả + log được ghi vào nhánh `ci-status` (để đọc lại bằng git)
# - Build thành công → tạo bản Release (pre-release) chứa .dmg / .exe / .msi
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: mysqli, openssl }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'apps/desktop/src-tauri -> target' }
      - name: Thư viện hệ thống cho Tauri (Linux)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev
      - run: chmod +x scripts/ci/*.sh
      - run: scripts/ci/step.sh npm-install npm install --no-audit --no-fund
      - run: scripts/ci/step.sh test-core npm test
      - run: scripts/ci/step.sh test-backend php backend/tests/run.php
      - run: scripts/ci/step.sh typecheck-ui npm run typecheck -w @holy-melody/desktop
        continue-on-error: true
      - run: scripts/ci/step.sh icons npm run icons
      - run: scripts/ci/step.sh vite-build npm run build -w @holy-melody/desktop
      - run: scripts/ci/step.sh cargo-check bash -c "cd apps/desktop/src-tauri && cargo check --locked || cargo check"
      - run: scripts/ci/step.sh cargo-test bash -c "cd apps/desktop/src-tauri && cargo test"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-check, path: ci-logs/, retention-days: 7 }

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-apple-silicon, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-intel, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'apps/desktop/src-tauri -> target', key: '${{ matrix.target }}' }
      - shell: bash
        run: chmod +x scripts/ci/*.sh
      - shell: bash
        run: scripts/ci/step.sh npm-install npm install --no-audit --no-fund
      - shell: bash
        run: scripts/ci/step.sh icons npm run icons
      - name: Cấu hình ký mã macOS (nếu có)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
          else
            echo "::warning::Chưa có chứng chỉ Apple → bản .dmg CHƯA KÝ."
          fi
      - name: Build ứng dụng
        shell: bash
        run: scripts/ci/step.sh tauri-build npm run tauri -w @holy-melody/desktop -- build --target ${{ matrix.target }}
      - name: Gom file cài đặt
        shell: bash
        run: |
          mkdir -p dist-installers
          b="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          for f in "$b"/dmg/*.dmg "$b"/msi/*.msi "$b"/nsis/*.exe; do
            [ -f "$f" ] || continue
            base=$(basename "$f"); ext="${base##*.}"
            cp "$f" "dist-installers/HolyMelody-${{ matrix.name }}-${base// /_}"
          done
          ls -la dist-installers
      - uses: actions/upload-artifact@v4
        with:
          name: holy-melody-${{ matrix.name }}
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'logs-${{ matrix.name }}', path: ci-logs/, retention-days: 7 }

  report:
    needs: [check, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: all }
      - name: Ghi kết quả vào nhánh ci-status
        env:
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          mkdir -p out && cd out
          git init -q -b ci-status
          git config user.name "holy-melody-ci"; git config user.email "ci@users.noreply.github.com"
          for d in ../all/logs-*; do [ -d "$d" ] && cp -r "$d" "./$(basename "$d")"; done
          # chỉ giữ 400 dòng cuối mỗi log cho gọn
          find . -name '*.log' -exec sh -c 'tail -n 400 "$1" > "$1.t" && mv "$1.t" "$1"' _ {} \;
          cat > status.json <<EOF
          {"run_id": "${{ github.run_id }}", "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "sha": "${{ github.sha }}", "check": "$CHECK", "build": "$BUILD", "finished_at": "$(date -u +%FT%TZ)"}
          EOF
          ls ../all > artifacts.txt
          git add -A && git commit -qm "CI ${{ github.run_id }} @ ${{ github.sha }}: check=$CHECK build=$BUILD"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status
      - name: Tạo Release khi build thành công
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          files=$(find all -path 'all/holy-melody-*' -type f)
          gh release create "$tag" $files --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Holy Melody – bản build ${{ github.run_number }}" \
            --notes "Bản build tự động từ commit ${{ github.sha }}. Chưa ký số: macOS chuột phải → Open; Windows chọn More info → Run anyway."
