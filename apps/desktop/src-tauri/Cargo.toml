[package]
name = "holy-melody"
version = "0.1.0"
edition = "2021"
description = "Holy Melody – đọc, soạn và hát bản nhạc"
license = "UNLICENSED"

[lib]
name = "holy_melody_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
rustysynth = "1.3"
cpal = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
